      # -----------------------------------------------------------------------
      # DISCOVERY RULES
      # -----------------------------------------------------------------------
      discovery_rules:

        # ==== DISCOVERY: POOLS ====
        - uuid: d7e8f9a0b1c2030d5e6f7a8b9c0d1e2f
          name: 'Discover Storage Pools'
          type: EXTERNAL
          key: 'flashsystem_collector.sh[{HOST.IP},discover,pools]'
          delay: '{$FS_DISCOVERY_INTERVAL}'
          lifetime: 3d
          description: |
            LLD de pools de almacenamiento via lsmdiskgrp.
            Macros disponibles: {#POOLID}, {#POOLNAME}, {#POOLSTATUS}
            TTL cache: {$FS_DISCOVERY_INTERVAL} (debe coincidir con DiscoveryTTL del collector).
          item_prototypes:

            - uuid: e8f9a0b1c2d3031e6f7a8b9c0d1e2f3a
              name: 'Pool {#POOLNAME}: Status'
              type: DEPENDENT
              key: 'flashsystem.pool.status[{HOST.IP},{#POOLNAME}]'
              master_item:
                key: 'flashsystem_collector.sh[{HOST.IP},collect]'
              history: 7d
              trends: '0'
              value_type: TEXT
              description: 'Estado del pool {#POOLNAME} (lsmdiskgrp campo status).'
              preprocessing:
                # FIX #1 + #8: filter expression es path INDEFINIDO -> .first()
                # FIX #8: macro entre comillas dobles para nombres con caracteres especiales
                - type: JSONPATH
                  parameters:
                    - '$.pools[?(@.name=="{#POOLNAME}")].status.first()'
                - type: TRIM
                  parameters:
                    - ' '
              tags:
                - tag: component
                  value: pool
              trigger_prototypes:
                - uuid: f9a0b1c2d3e4032f7a8b9c0d1e2f3a4b
                  expression: 'find(/IBM FlashSystem Collector/flashsystem.pool.status[{HOST.IP},{#POOLNAME}],,"like","online")=0'
                  name: '{HOST.NAME}: Pool {#POOLNAME} not online (estado: {ITEM.LASTVALUE})'
                  priority: HIGH
                  description: 'El pool de almacenamiento {#POOLNAME} no esta en estado online.'

            - uuid: a0b1c2d3e4f5033a8b9c0d1e2f3a4b5c
              name: 'Pool {#POOLNAME}: Total Capacity'
              type: DEPENDENT
              key: 'flashsystem.pool.capacity[{HOST.IP},{#POOLNAME}]'
              master_item:
                key: 'flashsystem_collector.sh[{HOST.IP},collect]'
              history: 7d
              trends: 90d
              value_type: UNSIGNED
              units: B
              description: |
                Capacidad total del pool {#POOLNAME} en bytes.
                FIX #1: .first() para path indefinido.
                FIX #2: JavaScript maneja tanto "44.0TB" como ["44.0TB"].
                FIX #8: macro con comillas dobles.
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.pools[?(@.name=="{#POOLNAME}")].capacity.first()'
                - type: TRIM
                  parameters:
                    - ' '
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var v = value;
                      if (v.charAt(0) === '[') {
                          try { v = JSON.parse(v)[0]; } catch(e) { throw 'JSON parse error: ' + value; }
                      }
                      v = ('' + v).replace(/^\s+|\s+$/g, '');
                      var match = v.match(/^([0-9]+\.?[0-9]*)\s*(TB|GB|MB|KB|B)$/i);
                      if (!match) { throw 'Cannot parse capacity: ' + value; }
                      var num = parseFloat(match[1]);
                      var unit = match[2].toUpperCase();
                      var m = {'B':1,'KB':1024,'MB':1048576,'GB':1073741824,'TB':1099511627776};
                      return Math.round(num * m[unit]);
              tags:
                - tag: component
                  value: pool

            - uuid: b1c2d3e4f5a6034b9c0d1e2f3a4b5c6d
              name: 'Pool {#POOLNAME}: Free Capacity'
              type: DEPENDENT
              key: 'flashsystem.pool.free[{HOST.IP},{#POOLNAME}]'
              master_item:
                key: 'flashsystem_collector.sh[{HOST.IP},collect]'
              history: 7d
              trends: 90d
              value_type: UNSIGNED
              units: B
              description: 'Capacidad libre del pool {#POOLNAME} en bytes. Convertida desde string IBM.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.pools[?(@.name=="{#POOLNAME}")].free_capacity.first()'
                - type: TRIM
                  parameters:
                    - ' '
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var v = value;
                      if (v.charAt(0) === '[') {
                          try { v = JSON.parse(v)[0]; } catch(e) { throw 'JSON parse error: ' + value; }
                      }
                      v = ('' + v).replace(/^\s+|\s+$/g, '');
                      var match = v.match(/^([0-9]+\.?[0-9]*)\s*(TB|GB|MB|KB|B)$/i);
                      if (!match) { throw 'Cannot parse capacity: ' + value; }
                      var num = parseFloat(match[1]);
                      var unit = match[2].toUpperCase();
                      var m = {'B':1,'KB':1024,'MB':1048576,'GB':1073741824,'TB':1099511627776};
                      return Math.round(num * m[unit]);
              tags:
                - tag: component
                  value: pool

            - uuid: c2d3e4f5a6b7035c0d1e2f3a4b5c6d7e
              name: 'Pool {#POOLNAME}: Used Capacity'
              type: DEPENDENT
              key: 'flashsystem.pool.used[{HOST.IP},{#POOLNAME}]'
              master_item:
                key: 'flashsystem_collector.sh[{HOST.IP},collect]'
              history: 7d
              trends: 90d
              value_type: UNSIGNED
              units: B
              description: 'Capacidad usada del pool {#POOLNAME} en bytes. Convertida desde string IBM.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.pools[?(@.name=="{#POOLNAME}")].used_capacity.first()'
                - type: TRIM
                  parameters:
                    - ' '
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var v = value;
                      if (v.charAt(0) === '[') {
                          try { v = JSON.parse(v)[0]; } catch(e) { throw 'JSON parse error: ' + value; }
                      }
                      v = ('' + v).replace(/^\s+|\s+$/g, '');
                      var match = v.match(/^([0-9]+\.?[0-9]*)\s*(TB|GB|MB|KB|B)$/i);
                      if (!match) { throw 'Cannot parse capacity: ' + value; }
                      var num = parseFloat(match[1]);
                      var unit = match[2].toUpperCase();
                      var m = {'B':1,'KB':1024,'MB':1048576,'GB':1073741824,'TB':1099511627776};
                      return Math.round(num * m[unit]);
              tags:
                - tag: component
                  value: pool

            # FIX #4: Calculated Item protegido contra division por cero.
            # Si capacity=0, la formula usa (capacity + (capacity==0)) = 1 como denominador
            # evitando el estado unsupported por division por cero.
            - uuid: d3e4f5a6b7c8036d1e2f3a4b5c6d7e8f
              name: 'Pool {#POOLNAME}: Usage Percent'
              type: CALCULATED
              key: 'flashsystem.pool.pct[{HOST.IP},{#POOLNAME}]'
              delay: '{$FS_COLLECT_INTERVAL}'
              history: 7d
              trends: 90d
              value_type: FLOAT
              units: '%'
              # FIX #4: denominador protegido contra division por cero
              # Si capacity=0, el denominador se convierte en 1 (0 + (0==0)=1)
              params: '100*last(//flashsystem.pool.used[{HOST.IP},{#POOLNAME}])/(last(//flashsystem.pool.capacity[{HOST.IP},{#POOLNAME}])+(last(//flashsystem.pool.capacity[{HOST.IP},{#POOLNAME}])==0))'
              description: |
                Porcentaje de uso del pool {#POOLNAME}.
                Formula: 100 * used / capacity
                FIX #4: protegido contra division por cero cuando capacity=0.
                Requiere que pool.used y pool.capacity tengan al menos un valor.
              tags:
                - tag: component
                  value: pool
              trigger_prototypes:
                - uuid: e4f5a6b7c8d9037e2f3a4b5c6d7e8f9a
                  expression: 'last(/IBM FlashSystem Collector/flashsystem.pool.pct[{HOST.IP},{#POOLNAME}])>={$FS_POOL_CRIT_PCT}'
                  name: '{HOST.NAME}: Pool {#POOLNAME} critically full ({ITEM.LASTVALUE}%)'
                  priority: HIGH
                  description: 'Uso del pool supera {$FS_POOL_CRIT_PCT}%. Agregar capacidad urgentemente.'
                  manual_close: 'YES'
                - uuid: f5a6b7c8d9e0038f3a4b5c6d7e8f9a0b
                  expression: |
                    last(/IBM FlashSystem Collector/flashsystem.pool.pct[{HOST.IP},{#POOLNAME}])>={$FS_POOL_WARN_PCT}
                    and
                    last(/IBM FlashSystem Collector/flashsystem.pool.pct[{HOST.IP},{#POOLNAME}])<{$FS_POOL_CRIT_PCT}
                  name: '{HOST.NAME}: Pool {#POOLNAME} space warning ({ITEM.LASTVALUE}%)'
                  priority: WARNING
                  description: 'Uso del pool supera {$FS_POOL_WARN_PCT}%. Planificar expansion de capacidad.'
                  manual_close: 'YES'

            - uuid: a6b7c8d9e0f1039a4b5c6d7e8f9a0b1c
              name: 'Pool {#POOLNAME}: Volume Count'
              type: DEPENDENT
              key: 'flashsystem.pool.vdisk_count[{HOST.IP},{#POOLNAME}]'
              master_item:
                key: 'flashsystem_collector.sh[{HOST.IP},collect]'
              history: 7d
              trends: 90d
              value_type: UNSIGNED
              description: 'Cantidad de volumenes en el pool {#POOLNAME} (lsmdiskgrp vdisk_count).'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.pools[?(@.name=="{#POOLNAME}")].vdisk_count.first()'
                - type: TRIM
                  parameters:
                    - ' '
              tags:
                - tag: component
                  value: pool

