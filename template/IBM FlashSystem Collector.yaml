              key: 'flashsystem.battery.status[{HOST.IP},{#BATTERYID}]'
              master_item:
                key: 'flashsystem_collector.sh[{HOST.IP},collect]'
              history: 7d
              trends: '0'
              value_type: TEXT
              description: |
                Estado de la bateria UPS {#BATTERYID} en enclosure {#ENCLOSUREID}.
                FIX #1: .first() | FIX #8: comillas dobles.
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.batteries[?(@.id=="{#BATTERYID}")].status.first()'
                - type: TRIM
                  parameters:
                    - ' '
              tags:
                - tag: component
                  value: battery
              trigger_prototypes:
                - uuid: c0f1a2b3c4d5075c0d1e2f3a4b5c6d7e
                  expression: 'find(/IBM FlashSystem Collector/flashsystem.battery.status[{HOST.IP},{#BATTERYID}],,"like","online")=0'
                  name: '{HOST.NAME}: Battery {#BATTERYID} (Enclosure {#ENCLOSUREID}) not online'
                  priority: HIGH
                  description: 'Bateria UPS no esta en estado online. Accion inmediata requerida para continuidad de servicio.'

            - uuid: c1f1a2b3c4d5075c1d1e2f3a4b5c6d7e
              name: 'Battery {#BATTERYID}: Health Score'
              type: DEPENDENT
              key: 'flashsystem.battery.health[{HOST.IP},{#BATTERYID}]'
              master_item:
                key: 'flashsystem_collector.sh[{HOST.IP},collect]'
              history: 7d
              trends: 90d
              value_type: UNSIGNED
              units: '%'
              description: 'Puntuacion de salud de la bateria {#BATTERYID}. Valores < 70% indican degradacion significativa.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.batteries[?(@.id=="{#BATTERYID}")].health_score.first()'
                - type: TRIM
                  parameters:
                    - ' '
              tags:
                - tag: component
                  value: battery
              trigger_prototypes:
                - uuid: d2f1a2b3c4d5086d2d1e2f3a4b5c6d7e
                  expression: 'max(/IBM FlashSystem Collector/flashsystem.battery.health[{HOST.IP},{#BATTERYID}],5m)<{$FS_BATTERY_HEALTH_WARN}'
                  name: '{HOST.NAME}: Battery {#BATTERYID} health degraded ({ITEM.LASTVALUE}%)'
                  priority: WARNING
                  description: 'Salud de bateria UPS baja. Considerar reemplazo dentro de un plan de mantenimiento.'
                - uuid: e3f1a2b3c4d5097e3d1e2f3a4b5c6d7e
                  expression: 'max(/IBM FlashSystem Collector/flashsystem.battery.health[{HOST.IP},{#BATTERYID}],5m)<{$FS_BATTERY_HEALTH_CRIT}'
                  name: '{HOST.NAME}: Battery {#BATTERYID} CRITICAL health ({ITEM.LASTVALUE}%)'
                  priority: HIGH
                  description: 'Salud critica de bateria UPS. Reemplazo urgente requerido. Riesgo de perdida de datos en cache.'

        # ==== DISCOVERY: PSUS ====
        - uuid: f4f1a2b3c4d5108f4e1e2f3a4b5c6d7e
          name: 'Discover Enclosure PSUs'
          type: EXTERNAL
          key: 'flashsystem_collector.sh[{HOST.IP},discover,psus]'
          delay: '{$FS_DISCOVERY_INTERVAL}'
          lifetime: 3d
          description: |
            LLD de fuentes de poder via lsenclosurepsu.
            Macros: {#PSUID}, {#ENCLOSUREID}, {#PSUSTATUS}, {#PSUSERIAL}
          item_prototypes:
            - uuid: a5f1a2b3c4d5119a5e1e2f3a4b5c6d7e
              name: 'PSU {#PSUID} (Enclosure {#ENCLOSUREID}): Status'
              type: DEPENDENT
              key: 'flashsystem.psu.status[{HOST.IP},{#PSUID}]'
              master_item:
                key: 'flashsystem_collector.sh[{HOST.IP},collect]'
              history: 7d
              trends: '0'
              value_type: TEXT
              description: |
                Estado de la fuente de poder {#PSUID} en enclosure {#ENCLOSUREID}.
                Serial: {#PSUSERIAL}.
                FIX #1: .first() | FIX #8: comillas dobles.
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.psus[?(@.id=="{#PSUID}")].status.first()'
                - type: TRIM
                  parameters:
                    - ' '
              tags:
                - tag: component
                  value: psu
              trigger_prototypes:
                - uuid: b6f1a2b3c4d512ab6f1e2f3a4b5c6d7e
                  expression: 'find(/IBM FlashSystem Collector/flashsystem.psu.status[{HOST.IP},{#PSUID}],,"like","online")=0'
                  name: '{HOST.NAME}: PSU {#PSUID} (Enclosure {#ENCLOSUREID}) not online'
                  priority: HIGH
                  description: 'Fuente de poder no esta en estado online. Serial: {#PSUSERIAL}. Accion inmediata requerida para redundancia de potencia.'

      # -----------------------------------------------------------------------
      # MACROS
      # -----------------------------------------------------------------------
      macros:
        - macro: '{$FS_COLLECT_INTERVAL}'
          value: '60'
          description: 'Intervalo del Master Item en segundos. Debe ser mayor que {$FS_TIMEOUT}.'

        - macro: '{$FS_TIMEOUT}'
          value: '55'
          description: |
            Timeout del External Script en segundos.
            REQUISITO: zabbix_server.conf debe tener Timeout=60 (o mayor).
            El item tiene timeout Override configurado a este valor.

        - macro: '{$FS_DISCOVERY_INTERVAL}'
          value: 4h
          description: 'Intervalo de LLD discovery. Debe coincidir con DiscoveryTTL del collector (FS_DISCOVERY_TTL=4h).'

        - macro: '{$FS_POOL_WARN_PCT}'
          value: '80'
          description: 'Umbral WARNING de uso de pool en % (0-100). Fuente: template IBM original.'

        - macro: '{$FS_POOL_CRIT_PCT}'
          value: '90'
          description: 'Umbral CRITICO de uso de pool en % (0-100).'

        # FIX #9: Thresholds ajustados para flash segun IBM Redbook SG248543
        - macro: '{$FS_LATENCY_READ_WARN}'
          value: '2'
          description: |
            Umbral WARNING latencia de lectura en ms.
            FIX: Ajustado de 10ms a 2ms para sistemas flash.
            Fuente: IBM Redbook SG248543 - flash tipicamente < 1ms.

        - macro: '{$FS_LATENCY_READ_CRIT}'
          value: '10'
          description: 'Umbral CRITICO latencia de lectura en ms.'

        - macro: '{$FS_LATENCY_WRITE_WARN}'
          value: '5'
          description: |
            Umbral WARNING latencia de escritura en ms.
            FIX: Ajustado de 10ms a 5ms para sistemas flash.

        - macro: '{$FS_LATENCY_WRITE_CRIT}'
          value: '50'
          description: |
            Umbral CRITICO latencia de escritura en ms.
            Fuente: IBM Redbook SG248543 cap.9 - "> 50ms indica sobrecarga del storage controller".

        - macro: '{$FS_CPU_WARN}'
          value: '80'
          description: 'Umbral WARNING de uso de CPU en %.'

        # FIX #6 NUEVO: thresholds de cache
        - macro: '{$FS_WRITE_CACHE_WARN}'
          value: '70'
          description: |
            Umbral WARNING de uso de write cache en %.
            Fuente: IBM Redbook SG248543 cap.9 - metrica critica de saturacion.

        - macro: '{$FS_WRITE_CACHE_CRIT}'
          value: '85'
          description: |
            Umbral CRITICO de uso de write cache en %.
            Valor sostenido > 85% indica riesgo de degradacion severa.

        # FIX #6 NUEVO: thresholds de temperatura
        - macro: '{$FS_TEMP_WARN}'
          value: '35'
          description: 'Umbral WARNING de temperatura ambiente en Celsius.'

        - macro: '{$FS_TEMP_CRIT}'
          value: '40'
          description: 'Umbral CRITICO de temperatura ambiente en Celsius.'

        # FIX #7: Thresholds para componentes criticos (batteries, psus)
        - macro: '{$FS_BATTERY_HEALTH_WARN}'
          value: '70'
          description: 'Umbral WARNING de salud de bateria (health_score) en %. Valores < 70% indican degradacion significativa.'

        - macro: '{$FS_BATTERY_HEALTH_CRIT}'
          value: '50'
          description: 'Umbral CRITICO de salud de bateria. Reemplazar bateria si es menor a este valor. Riesgo de perdida de datos.'