      # -----------------------------------------------------------------------
      # MACROS
      # -----------------------------------------------------------------------
      macros:
        - macro: '{$FS_COLLECT_INTERVAL}'
          value: '60'
          description: 'Intervalo de recoleccion del Master Item en segundos.'
        - macro: '{$FS_TIMEOUT}'
          value: '55'
          description: 'Timeout del External Script en segundos. Debe ser menor que FS_COLLECT_INTERVAL.'
        - macro: '{$FS_DISCOVERY_INTERVAL}'
          value: 4h
          description: 'Intervalo de discovery LLD. Coincide con DiscoveryTTL del collector.'
        - macro: '{$FS_POOL_WARN_PCT}'
          value: '80'
          description: 'Umbral WARNING de uso de pool en porcentaje. NO usado actualmente (capacidades son string).'
        - macro: '{$FS_POOL_CRIT_PCT}'
          value: '90'
          description: 'Umbral CRITICO de uso de pool en porcentaje. NO usado actualmente (capacidades son string).'
        - macro: '{$FS_LATENCY_READ_WARN}'
          value: '10'
          description: 'Umbral WARNING de latencia de lectura en ms.'
        - macro: '{$FS_LATENCY_WRITE_WARN}'
          value: '10'
          description: 'Umbral WARNING de latencia de escritura en ms.'
        - macro: '{$FS_CPU_WARN}'
          value: '80'
          description: 'Umbral WARNING de uso de CPU en porcentaje.'