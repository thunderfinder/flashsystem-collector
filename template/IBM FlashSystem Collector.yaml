zabbix_export:
  version: '6.4'
  template_groups:
    - uuid: 7df96b18c230490a9a0a9e2307226338
      name: Templates
    - uuid: 7c2cb727f85b492d88cd56e17127c64d
      name: Templates/SAN
  templates:
    - uuid: a1b2c3d4e5f6478a9b0c1d2e3f4a5b6c
      template: 'IBM FlashSystem Collector'
      name: 'IBM FlashSystem Collector'
      description: |
        Template para IBM FlashSystem / Spectrum Virtualize v8.7+
        Requiere flashsystem-collector v2.0.0 en el servidor Zabbix.
        Credenciales en /etc/zabbix/flashsystem/env (nunca en la key).

        ARQUITECTURA:
          1 Master Item (External Script) -> JSON completo
          Dependent Items consumen JSON via JSONPath
          LLD Discovery por categoria separada

        PREREQUISITOS EN ZABBIX SERVER:
          zabbix_server.conf: Timeout=60
          SELinux: setsebool -P zabbix_can_network on

        CORRECCION v2 (hallazgos de auditoria):
          - JSONPath filter usa .first() para paths indefinidos
          - JavaScript maneja tanto "valor" como ["valor"]
          - Units corregidas: vdisk_ms/mdisk_ms/drive_ms en microsegundos
          - Calculated Item protegido contra division por cero
          - Agregados: write_cache_pc, total_cache_pc, temp_c, power_w
          - LLD macros en JSONPath con comillas dobles
          - Thresholds de latencia ajustados para flash (2ms warn / 10ms crit)
          - LLD completo: 8 categorias (drives, pools, volumes, enclosures, nodes, ports, batteries, psus)
      groups:
        - name: Templates
        - name: Templates/SAN

      # -----------------------------------------------------------------------
      # VALUE MAPS
      # -----------------------------------------------------------------------
      valuemaps:
        - uuid: f1a2b3c4d5e6478f9a0b1c2d3e4f5a6b
          name: 'FlashSystem Online Status'
          mappings:
            - value: 'online'
              newvalue: 'Online'
            - value: 'offline'
              newvalue: 'Offline'
            - value: 'degraded'
              newvalue: 'Degraded'

      # -----------------------------------------------------------------------
      # ITEMS FIJOS
      # -----------------------------------------------------------------------
      items:

        # ---- ICMP ----
        - uuid: b1c2d3e4f5a6478b9c0d1e2f3a4b5c6d
          name: 'ICMP Ping'
          type: SIMPLE
          key: icmpping
          history: 7d
          tags:
            - tag: component
              value: network
          triggers:
            - uuid: c2d3e4f5a6b7489c0d1e2f3a4b5c6d7e
              expression: 'max(/IBM FlashSystem Collector/icmpping,#3)=0'
              name: '{HOST.NAME}: Host unreachable por ICMP'
              priority: HIGH
              description: 'El host no responde a ICMP por 3 checks consecutivos.'

        # ---- MASTER ITEM ----
        # Una sola conexion SSH por ciclo. Todos los Dependent Items lo consumen.
        # Las credenciales NO van en la key: estan en /etc/zabbix/flashsystem/env
        - uuid: d3e4f5a6b7c8490d1e2f3a4b5c6d7e8f
          name: 'FlashSystem: Master Collector JSON'
          type: EXTERNAL
          key: 'flashsystem_collector.sh[{HOST.IP},collect]'
          delay: '{$FS_COLLECT_INTERVAL}'
          history: 1h
          trends: '0'
          value_type: TEXT
          timeout: '{$FS_TIMEOUT}'
          description: |
            Master Item. Ejecuta flashsystem_collector.sh collect.
            JSON completo: system, nodes, enclosures, drives, pools,
            volumes, ports, flashcopy, replication, performance, status.
            Requiere Timeout={$FS_TIMEOUT} en zabbix_server.conf.
          tags:
            - tag: component
              value: collector

        # ---- COLLECTOR HEALTH ----
        - uuid: e4f5a6b7c8d9401e2f3a4b5c6d7e8f9a
          name: 'FlashSystem: Collector Success'
          type: DEPENDENT
          key: 'flashsystem.collector.success[{HOST.IP}]'
          master_item:
            key: 'flashsystem_collector.sh[{HOST.IP},collect]'
          history: 7d
          trends: '0'
          value_type: UNSIGNED
          description: '1=coleccion exitosa. 0=todos los collectors fallaron.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.status.success'
            - type: BOOL_TO_DECIMAL
          tags:
            - tag: component
              value: collector
          triggers:
            - uuid: f5a6b7c8d9e0412f3a4b5c6d7e8f9a0b
              expression: 'max(/IBM FlashSystem Collector/flashsystem.collector.success[{HOST.IP}],#3)=0'
              name: '{HOST.NAME}: FlashSystem collector failing'
              priority: HIGH
              description: |
                El collector Go no puede obtener datos del FlashSystem.
                Verificar: SSH, credenciales en /etc/zabbix/flashsystem/env,
                log en /var/log/zabbix/flashsystem_collector.log

        - uuid: a6b7c8d9e0f1423a4b5c6d7e8f9a0b1c
          name: 'FlashSystem: Collector Duration'
          type: DEPENDENT
          key: 'flashsystem.collector.duration[{HOST.IP}]'
          master_item:
            key: 'flashsystem_collector.sh[{HOST.IP},collect]'
          history: 7d
          trends: 90d
          value_type: UNSIGNED
          units: ms
          description: 'Duracion total de la recoleccion en ms.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.status.duration_ms'
          tags:
            - tag: component
              value: collector

        # ---- SYSTEM ----
        - uuid: b7c8d9e0f1a2434b5c6d7e8f9a0b1c2d
          name: 'FlashSystem: System Status'
          type: DEPENDENT
          key: 'flashsystem.system.status[{HOST.IP}]'
          master_item:
            key: 'flashsystem_collector.sh[{HOST.IP},collect]'
          history: 7d
          trends: '0'
          value_type: TEXT
          description: |
            Estado del cluster (lssystem campo status).
            Valores posibles: online, offline, degraded.
          preprocessing:
            # FIX #1: $.system[0] es path definido (por indice) -> no necesita .first()
            - type: JSONPATH
              parameters:
                - '$.system[0].status'
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: c8d9e0f1a2b3445c6d7e8f9a0b1c2d3e
              expression: 'find(/IBM FlashSystem Collector/flashsystem.system.status[{HOST.IP}],,"like","online")=0'
              name: '{HOST.NAME}: FlashSystem cluster NOT online (estado: {ITEM.LASTVALUE})'
              priority: DISASTER
              description: 'El sistema no esta en estado online. Accion inmediata requerida.'

        - uuid: d9e0f1a2b3c4456d7e8f9a0b1c2d3e4f
          name: 'FlashSystem: System Name'
          type: DEPENDENT
          key: 'flashsystem.system.name[{HOST.IP}]'
          master_item:
            key: 'flashsystem_collector.sh[{HOST.IP},collect]'
          history: 7d
          trends: '0'
          value_type: TEXT
          description: 'Nombre del cluster (lssystem campo name).'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.system[0].name'
          tags:
            - tag: component
              value: system

        - uuid: e0f1a2b3c4d5467e8f9a0b1c2d3e4f5a
          name: 'FlashSystem: Firmware Version'
          type: DEPENDENT
          key: 'flashsystem.system.firmware[{HOST.IP}]'
          master_item:
            key: 'flashsystem_collector.sh[{HOST.IP},collect]'
          history: 7d
          trends: '0'
          value_type: TEXT
          description: 'Version de firmware (lssystem campo code_level). Ej: 8.7.0.0 (build 162.24.2310201505)'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.system[0].code_level'
          tags:
            - tag: component
              value: system

        - uuid: f1a2b3c4d5e6001f9a0b1c2d3e4f5a6b
          name: 'FlashSystem: Total Raw Capacity'
          type: DEPENDENT
          key: 'flashsystem.system.capacity.total[{HOST.IP}]'
          master_item:
            key: 'flashsystem_collector.sh[{HOST.IP},collect]'
          history: 7d
          trends: 90d
          value_type: UNSIGNED
          units: B
          description: |
            Capacidad total de MDisk en bytes (lssystem total_mdisk_capacity).
            Convertida desde string IBM (ej: "44.0TB") via JavaScript.
            FIX #2: JavaScript maneja tanto "44.0TB" como ["44.0TB"].
            FIX #3: path $.system[0] es definido, no necesita .first()
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.system[0].total_mdisk_capacity'
            - type: JAVASCRIPT
              parameters:
                - |
                  var v = value;
                  if (v.charAt(0) === '[') {
                      try { v = JSON.parse(v)[0]; } catch(e) { throw 'JSON parse error: ' + value; }
                  }
                  v = ('' + v).replace(/^\s+|\s+$/g, '');
                  var match = v.match(/^([0-9]+\.?[0-9]*)\s*(TB|GB|MB|KB|B)$/i);
                  if (!match) { throw 'Cannot parse capacity: ' + value; }
                  var num = parseFloat(match[1]);
                  var unit = match[2].toUpperCase();
                  var m = {'B':1,'KB':1024,'MB':1048576,'GB':1073741824,'TB':1099511627776};
                  return Math.round(num * m[unit]);
          tags:
            - tag: component
              value: system

        - uuid: a2b3c4d5e6f7002a0b1c2d3e4f5a6b7c
          name: 'FlashSystem: Total Free Space'
          type: DEPENDENT
          key: 'flashsystem.system.capacity.free[{HOST.IP}]'
          master_item:
            key: 'flashsystem_collector.sh[{HOST.IP},collect]'
          history: 7d
          trends: 90d
          value_type: UNSIGNED
          units: B
          description: 'Espacio libre total en bytes (lssystem total_free_space). Convertido desde string IBM.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.system[0].total_free_space'
            - type: JAVASCRIPT
              parameters:
                - |
                  var v = value;
                  if (v.charAt(0) === '[') {
                      try { v = JSON.parse(v)[0]; } catch(e) { throw 'JSON parse error: ' + value; }
                  }
                  v = ('' + v).replace(/^\s+|\s+$/g, '');
                  var match = v.match(/^([0-9]+\.?[0-9]*)\s*(TB|GB|MB|KB|B)$/i);
                  if (!match) { throw 'Cannot parse capacity: ' + value; }
                  var num = parseFloat(match[1]);
                  var unit = match[2].toUpperCase();
                  var m = {'B':1,'KB':1024,'MB':1048576,'GB':1073741824,'TB':1099511627776};
                  return Math.round(num * m[unit]);
          tags:
            - tag: component
              value: system

        - uuid: b3c4d5e6f7a8003b1c2d3e4f5a6b7c8d
          name: 'FlashSystem: Statistics Status'
          type: DEPENDENT
          key: 'flashsystem.system.statistics[{HOST.IP}]'
          master_item:
            key: 'flashsystem_collector.sh[{HOST.IP},collect]'
          history: 7d
          trends: '0'
          value_type: TEXT
          description: |
            Estado de estadisticas de rendimiento (lssystem statistics_status).
            Valores: on/off. Si es off, todas las metricas de performance estaran vacias.
            Activar con: svctask startstats (en el CLI del FlashSystem)
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.system[0].statistics_status'
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: c4d5e6f7a8b9004c2d3e4f5a6b7c8d9e
              expression: 'find(/IBM FlashSystem Collector/flashsystem.system.statistics[{HOST.IP}],,"like","on")=0'
              name: '{HOST.NAME}: FlashSystem statistics disabled'
              priority: WARNING
              description: |
                Las estadisticas de rendimiento estan deshabilitadas.
                Los items de performance (IOPS, latencia, throughput) no tendran datos.
                Solucion: svctask startstats en el CLI del storage.

        - uuid: d5e6f7a8b9c0005d3e4f5a6b7c8d9e0f
          name: 'FlashSystem: Number of Nodes'
          type: DEPENDENT
          key: 'flashsystem.system.nodes[{HOST.IP}]'
          master_item:
            key: 'flashsystem_collector.sh[{HOST.IP},collect]'
          history: 7d
          trends: 90d
          value_type: UNSIGNED
          description: 'Cantidad de nodos en el cluster (lssystem number_of_nodes).'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.system[0].number_of_nodes'
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: e6f7a8b9c0d1006e4f5a6b7c8d9e0f1a
              expression: 'last(/IBM FlashSystem Collector/flashsystem.system.nodes[{HOST.IP}])<2'
              name: '{HOST.NAME}: FlashSystem menos de 2 nodos activos'
              priority: HIGH
              description: 'El cluster opera con menos de 2 nodos. Redundancia comprometida.'

        # ---- PERFORMANCE ----
        # FIX #1: Todas las expresiones con [?(@.stat_name==...)] son INDEFINIDAS.
        # Agregar .first() para extraer el valor escalar del array resultado.

        - uuid: f7a8b9c0d1e2007f5a6b7c8d9e0f1a2b
          name: 'FlashSystem: Read IOPS'
          type: DEPENDENT
          key: 'flashsystem.perf.read_io[{HOST.IP}]'
          master_item:
            key: 'flashsystem_collector.sh[{HOST.IP},collect]'
          history: 7d
          trends: 90d
          value_type: UNSIGNED
          units: iops
          description: 'IOPS de lectura actuales (lssystemstats read_io stat_current).'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.performance[?(@.stat_name==''read_io'')].stat_current.first()'
            - type: TRIM
              parameters:
                - ' '
          tags:
            - tag: component
              value: performance

        - uuid: a8b9c0d1e2f3008a6b7c8d9e0f1a2b3c
          name: 'FlashSystem: Write IOPS'
          type: DEPENDENT
          key: 'flashsystem.perf.write_io[{HOST.IP}]'
          master_item:
            key: 'flashsystem_collector.sh[{HOST.IP},collect]'
          history: 7d
          trends: 90d
          value_type: UNSIGNED
          units: iops
          description: 'IOPS de escritura actuales (lssystemstats write_io stat_current).'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.performance[?(@.stat_name==''write_io'')].stat_current.first()'
            - type: TRIM
              parameters:
                - ' '
          tags:
            - tag: component
              value: performance

        - uuid: b9c0d1e2f3a4009b7c8d9e0f1a2b3c4d
          name: 'FlashSystem: Read Throughput'
          type: DEPENDENT
          key: 'flashsystem.perf.read_mb[{HOST.IP}]'
          master_item:
            key: 'flashsystem_collector.sh[{HOST.IP},collect]'
          history: 7d
          trends: 90d
          value_type: UNSIGNED
          units: MBps
          description: 'Throughput de lectura en MB/s (lssystemstats read_mb stat_current).'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.performance[?(@.stat_name==''read_mb'')].stat_current.first()'
            - type: TRIM
              parameters:
                - ' '
          tags:
            - tag: component
              value: performance

        - uuid: c0d1e2f3a4b5010c8d9e0f1a2b3c4d5e
          name: 'FlashSystem: Write Throughput'
          type: DEPENDENT
          key: 'flashsystem.perf.write_mb[{HOST.IP}]'
          master_item:
            key: 'flashsystem_collector.sh[{HOST.IP},collect]'
          history: 7d
          trends: 90d
          value_type: UNSIGNED
          units: MBps
          description: 'Throughput de escritura en MB/s (lssystemstats write_mb stat_current).'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.performance[?(@.stat_name==''write_mb'')].stat_current.first()'
            - type: TRIM
              parameters:
                - ' '
          tags:
            - tag: component
              value: performance

        # FIX #3: read_ms y write_ms son en MILISEGUNDOS segun CLI guide tabla 64.
        # vdisk_ms, mdisk_ms, drive_ms son en MICROSEGUNDOS.
        - uuid: d1e2f3a4b5c6011d9e0f1a2b3c4d5e6f
          name: 'FlashSystem: Read Latency'
          type: DEPENDENT
          key: 'flashsystem.perf.read_ms[{HOST.IP}]'
          master_item:
            key: 'flashsystem_collector.sh[{HOST.IP},collect]'
          history: 7d
          trends: 90d
          value_type: UNSIGNED
          units: ms
          description: |
            Latencia de lectura en ms (lssystemstats read_ms stat_current).
            NOTA: read_ms es milisegundos (confirmado CLI guide tabla 64).
            Para flash: tipicamente < 1ms. Warning a {$FS_LATENCY_READ_WARN}.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.performance[?(@.stat_name==''read_ms'')].stat_current.first()'
            - type: TRIM
              parameters:
                - ' '
          tags:
            - tag: component
              value: performance
          triggers:
            - uuid: e2f3a4b5c6d7012e0f1a2b3c4d5e6f7a
              expression: 'min(/IBM FlashSystem Collector/flashsystem.perf.read_ms[{HOST.IP}],5m)>{$FS_LATENCY_READ_WARN}'
              name: '{HOST.NAME}: High read latency ({ITEM.LASTVALUE}ms)'
              priority: WARNING
              description: 'Latencia de lectura elevada sostenida por 5 minutos.'
            - uuid: f3a4b5c6d7e8013f1a2b3c4d5e6f7a8b
              expression: 'min(/IBM FlashSystem Collector/flashsystem.perf.read_ms[{HOST.IP}],5m)>{$FS_LATENCY_READ_CRIT}'
              name: '{HOST.NAME}: CRITICAL read latency ({ITEM.LASTVALUE}ms)'
              priority: HIGH
              description: 'Latencia de lectura critica sostenida por 5 minutos. Impacto en aplicaciones probable.'

        - uuid: a4b5c6d7e8f9014a2b3c4d5e6f7a8b9c
          name: 'FlashSystem: Write Latency'
          type: DEPENDENT
          key: 'flashsystem.perf.write_ms[{HOST.IP}]'
          master_item:
            key: 'flashsystem_collector.sh[{HOST.IP},collect]'
          history: 7d
          trends: 90d
          value_type: UNSIGNED
          units: ms
          description: |
            Latencia de escritura en ms (lssystemstats write_ms stat_current).
            NOTA: write_ms es milisegundos (confirmado CLI guide tabla 64).
            IBM Redbook SG248543: respuesta esperada < 50ms. Warning a {$FS_LATENCY_WRITE_WARN}.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.performance[?(@.stat_name==''write_ms'')].stat_current.first()'
            - type: TRIM
              parameters:
                - ' '
          tags:
            - tag: component
              value: performance
          triggers:
            - uuid: b5c6d7e8f9a0015b3c4d5e6f7a8b9c0d
              expression: 'min(/IBM FlashSystem Collector/flashsystem.perf.write_ms[{HOST.IP}],5m)>{$FS_LATENCY_WRITE_WARN}'
              name: '{HOST.NAME}: High write latency ({ITEM.LASTVALUE}ms)'
              priority: WARNING
              description: 'Latencia de escritura elevada sostenida por 5 minutos.'
            - uuid: c6d7e8f9a0b1016c4d5e6f7a8b9c0d1e
              expression: 'min(/IBM FlashSystem Collector/flashsystem.perf.write_ms[{HOST.IP}],5m)>{$FS_LATENCY_WRITE_CRIT}'
              name: '{HOST.NAME}: CRITICAL write latency ({ITEM.LASTVALUE}ms)'
              priority: HIGH
              description: |
                Latencia de escritura critica (>50ms) sostenida por 5 minutos.
                IBM Redbook SG248543: > 50ms indica sobrecarga del storage controller.

        - uuid: d7e8f9a0b1c2017d5e6f7a8b9c0d1e2f
          name: 'FlashSystem: CPU Usage'
          type: DEPENDENT
          key: 'flashsystem.perf.cpu_pc[{HOST.IP}]'
          master_item:
            key: 'flashsystem_collector.sh[{HOST.IP},collect]'
          history: 7d
          trends: 90d
          value_type: UNSIGNED
          units: '%'
          description: 'Porcentaje de uso de CPU del sistema (lssystemstats cpu_pc stat_current).'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.performance[?(@.stat_name==''cpu_pc'')].stat_current.first()'
            - type: TRIM
              parameters:
                - ' '
          tags:
            - tag: component
              value: performance
          triggers:
            - uuid: e8f9a0b1c2d3018e6f7a8b9c0d1e2f3a
              expression: 'min(/IBM FlashSystem Collector/flashsystem.perf.cpu_pc[{HOST.IP}],5m)>{$FS_CPU_WARN}'
              name: '{HOST.NAME}: High CPU usage ({ITEM.LASTVALUE}%)'
              priority: WARNING

        - uuid: f9a0b1c2d3e4019f7a8b9c0d1e2f3a4b
          name: 'FlashSystem: FC Throughput'
          type: DEPENDENT
          key: 'flashsystem.perf.fc_mb[{HOST.IP}]'
          master_item:
            key: 'flashsystem_collector.sh[{HOST.IP},collect]'
          history: 7d
          trends: 90d
          value_type: UNSIGNED
          units: MBps
          description: 'Throughput total Fibre Channel en MB/s (lssystemstats fc_mb stat_current). Incluye host I/O y comunicacion interna.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.performance[?(@.stat_name==''fc_mb'')].stat_current.first()'
            - type: TRIM
              parameters:
                - ' '
          tags:
            - tag: component
              value: performance

        - uuid: a0b1c2d3e4f5020a8b9c0d1e2f3a4b5c
          name: 'FlashSystem: FC IOPS'
          type: DEPENDENT
          key: 'flashsystem.perf.fc_io[{HOST.IP}]'
          master_item:
            key: 'flashsystem_collector.sh[{HOST.IP},collect]'
          history: 7d
          trends: 90d
          value_type: UNSIGNED
          units: iops
          description: 'IOPS totales Fibre Channel (lssystemstats fc_io stat_current).'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.performance[?(@.stat_name==''fc_io'')].stat_current.first()'
            - type: TRIM
              parameters:
                - ' '
          tags:
            - tag: component
              value: performance

        # FIX #3 NUEVO: vdisk_ms es MICROSEGUNDOS segun CLI guide tabla 64.
        # "vdisk_ms: average time in microseconds that the system takes to respond"
        - uuid: b1c2d3e4f5a6021b9c0d1e2f3a4b5c6d
          name: 'FlashSystem: VDisk Response Time'
          type: DEPENDENT
          key: 'flashsystem.perf.vdisk_ms[{HOST.IP}]'
          master_item:
            key: 'flashsystem_collector.sh[{HOST.IP},collect]'
          history: 7d
          trends: 90d
          value_type: UNSIGNED
          units: us
          description: |
            Tiempo de respuesta promedio a volumes en MICROSEGUNDOS
            (lssystemstats vdisk_ms stat_current).
            ATENCION: Esta metrica es en us (microsegundos), NO milisegundos.
            Fuente: CLI Guide tabla 64 - "average time in microseconds".
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.performance[?(@.stat_name==''vdisk_ms'')].stat_current.first()'
            - type: TRIM
              parameters:
                - ' '
          tags:
            - tag: component
              value: performance

        # FIX #6 NUEVO: write_cache_pc - CRITICO para detectar saturacion de cache
        # IBM Redbook SG248543 cap.9: metrica mas importante de saturacion del sistema
        - uuid: c2d3e4f5a6b7022c0d1e2f3a4b5c6d7e
          name: 'FlashSystem: Write Cache Usage'
          type: DEPENDENT
          key: 'flashsystem.perf.write_cache_pc[{HOST.IP}]'
          master_item:
            key: 'flashsystem_collector.sh[{HOST.IP},collect]'
          history: 7d
          trends: 90d
          value_type: UNSIGNED
          units: '%'
          description: |
            Porcentaje de uso del write cache (lssystemstats write_cache_pc stat_current).
            CRITICO: Segun IBM Redbook SG248543 cap.9, un valor sostenido >80%
            indica que el sistema escribe mas rapido de lo que puede destagar.
            Esta condicion precede fallos de rendimiento graves.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.performance[?(@.stat_name==''write_cache_pc'')].stat_current.first()'
            - type: TRIM
              parameters:
                - ' '
          tags:
            - tag: component
              value: performance
          triggers:
            - uuid: d3e4f5a6b7c8023d1e2f3a4b5c6d7e8f
              expression: 'min(/IBM FlashSystem Collector/flashsystem.perf.write_cache_pc[{HOST.IP}],5m)>{$FS_WRITE_CACHE_WARN}'
              name: '{HOST.NAME}: High write cache usage ({ITEM.LASTVALUE}%)'
              priority: WARNING
              description: |
                Write cache supera {$FS_WRITE_CACHE_WARN}%.
                Fuente: IBM Redbook SG248543 - indicador de sobrecarga de escritura.
            - uuid: e4f5a6b7c8d9024e2f3a4b5c6d7e8f9a
              expression: 'min(/IBM FlashSystem Collector/flashsystem.perf.write_cache_pc[{HOST.IP}],5m)>{$FS_WRITE_CACHE_CRIT}'
              name: '{HOST.NAME}: CRITICAL write cache usage ({ITEM.LASTVALUE}%)'
              priority: HIGH
              description: |
                Write cache supera {$FS_WRITE_CACHE_CRIT}%.
                Riesgo de degradacion severa de rendimiento o perdida de datos en cache.
                Accion inmediata: revisar carga de escritura y capacidad de destage.

        # FIX #6 NUEVO: total_cache_pc
