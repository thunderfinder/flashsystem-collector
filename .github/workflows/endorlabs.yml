# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Endor Labs
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '35 8 * * 1'
jobs:
  scan:
    permissions:
      security-events: write # Used to upload sarif artifact to GitHub
      contents: read # Used to checkout a private repository by actions/checkout.
      actions: read # Required for private repositories to upload sarif files. GitHub Advanced Security licenses are required.
      id-token: write # Used for keyless authentication to Endor Labs
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false
    - name: Endor Labs scan pull request
      if: github.event_name == 'pull_request' && vars.ENDOR_NAMESPACE != ''
      uses: endorlabs/github-action@b51bd06466b545f01a6ac788e3e1147695d3936c
      with:
        namespace: ${{ vars.ENDOR_NAMESPACE }}
        sarif_file: findings.sarif
    - name: Endor Labs scan monitor
      if: github.event_name == 'push' && vars.ENDOR_NAMESPACE != ''
      uses: endorlabs/github-action@b51bd06466b545f01a6ac788e3e1147695d3936c
      with:
        namespace: ${{ vars.ENDOR_NAMESPACE }}
        ci_run: "false"
        sarif_file: findings.sarif
    - name: Upload SARIF to github
      if: vars.ENDOR_NAMESPACE != ''
      uses: github/codeql-action/upload-sarif@6bb031afdd8eb862ea3fc1848194185e076637e5 # v3.28.11
      with:
        sarif_file: findings.sarif
