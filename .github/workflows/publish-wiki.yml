name: Publish Wiki

on:
  push:
    branches: [ "main" ]
    paths:
      - 'docs/wiki/**'
      - '.github/workflows/publish-wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-wiki:
    name: Sync docs/wiki to GitHub Wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: Sync and push to GitHub Wiki
        env:
          WIKI_REPO_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Configuring Wiki sync ==="
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          WIKI_REPO_URL="https://x-access-token:${WIKI_REPO_TOKEN}@github.com/${{ github.repository }}.wiki.git"
          WORK_DIR="/tmp/wiki_repo"

          echo "Cloning Wiki repository..."
          if ! git clone "${WIKI_REPO_URL}" "${WORK_DIR}"; then
            echo "::error::Could not clone Wiki repository. Ensure GitHub Wiki is initialized with at least one page in repository settings."
            exit 1
          fi

          echo "Copying documentation pages to Wiki root..."
          cp -r docs/wiki/*.md "${WORK_DIR}/"

          cd "${WORK_DIR}"
          git add .

          if git diff --cached --quiet; then
            echo "Wiki content is already up-to-date. Nothing to commit."
          else
            git commit -m "docs(wiki): update GitHub Wiki from main docs/wiki (${{ github.sha }})"
            git push origin master
            echo "Successfully published Wiki pages to https://github.com/${{ github.repository }}/wiki"
          fi
